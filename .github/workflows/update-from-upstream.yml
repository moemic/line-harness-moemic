name: Harness automatic update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'checkは確認、dry-runはビルドまで、updateは新しい安定版を反映'
        type: choice
        options: [check, dry-run, update]
        default: check
      harness:
        description: '対象Harness'
        type: choice
        options: [both, line, x]
        default: both
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  statuses: read

concurrency:
  group: harness-automatic-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'moemic/line-harness-moemic'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: node scripts/harness-auto-update.test.mjs
      - name: 更新エンジンの準備
        if: github.event_name == 'schedule' || inputs.mode != 'check'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @line-harness/update-engine build
      - name: 正式リリース確認と自動更新
        run: node scripts/harness-auto-update.mjs "$UPDATE_MODE"
        env:
          UPDATE_MODE: ${{ github.event_name == 'schedule' && 'update' || inputs.mode }}
          HARNESS_TARGET: ${{ inputs.harness || 'both' }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 一度限りのX Pages書き込み確認
        if: inputs.mode == 'dry-run' && inputs.harness == 'x'
        run: |
          node --input-type=module -e 'import { readdirSync } from "node:fs"; import { execFileSync } from "node:child_process"; const folder = readdirSync(".harness-runtime").find(n => n.startsWith("x-source-")); if (!folder) throw Error("ビルド成果物なし"); execFileSync("pnpm", ["exec", "wrangler", "pages", "deploy", `.harness-runtime/${folder}/apps/web/out`, "--project-name", "x-harness-web", "--branch", "harness-auto-update-validation"], {stdio:"inherit"});'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
