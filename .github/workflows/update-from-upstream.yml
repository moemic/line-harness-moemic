name: Harness automatic update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-automatic-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'moemic/line-harness-moemic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/harness-auto-update.test.mjs
      - name: 既存Workerと管理画面の接続確認
        run: node scripts/harness-auto-update.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
